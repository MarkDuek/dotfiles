# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_status_background 'none'

# Rounded edges without reversed colors, so the outside stays transparent.
set -g @catppuccin_window_left_separator '#[fg=#{@catppuccin_window_number_color},bg=default,noreverse]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=#{@catppuccin_window_text_color},bg=default,noreverse]'
set -g @catppuccin_window_current_left_separator '#[fg=#{@catppuccin_window_current_number_color},bg=default,noreverse]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '#[fg=#{@catppuccin_window_current_text_color},bg=default,noreverse]'

# Mouse and terminal support
set -g mouse on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-kitty:RGB'
set -g allow-passthrough on
set -ag update-environment ' TERM TERM_PROGRAM'

# Smaller wheel increments in copy mode
bind -T copy-mode-vi WheelUpPane send -N 2 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 2 -X scroll-down
bind -T copy-mode WheelUpPane send -N 2 -X scroll-up
bind -T copy-mode WheelDownPane send -N 2 -X scroll-down

# Initialize TPM last.
run '~/.tmux/plugins/tpm/tpm'
